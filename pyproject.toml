[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zocdoc-provider-collector"
version = "0.2.0.dev9+dailyupdater961"
description = "Reusable local pipeline for collecting and parsing Zocdoc provider data across specialties."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Project Maintainers"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.0,<4",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4"
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1"
]

[project.scripts]
zocdoc-collector = "zocdoc_ortho.cli:main"
zocdoc-ortho = "zocdoc_ortho.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zocdoc_ortho = ["chrome_extension/*.js", "chrome_extension/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
